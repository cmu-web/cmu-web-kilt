<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sign In With a Test Account - Buggy - Carnegie Mellon University</title>
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,400italic,300italic,300,600,700,700italic"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://www.cmu.edu/common/standard-v6/css/main.6.7.min.css"
      media="screen"
      rel="stylesheet"
      type="text/css"
    />
    <link href="../css/cmu-cms.css" rel="stylesheet" type="text/css" />
    <link href="../css/cmu-app.css" rel="stylesheet" type="text/css" />
    <link href="https://www.cmu.edu/favicon.ico" rel="icon" />
  </head>
  <body class="no-js cmu-app" data-cmu-menu="closed">
    <!-- An example of the Developer Sign-In page, on its own.
         See accounts.html#developer-sign-in -->
    <div id="container">
      <header>
        <div class="roof">
          <div>
            <a class="wordmark" href="https://www.cmu.edu/">Carnegie Mellon University</a>
          </div>
        </div>
      </header>
      <main
        id="content"
        class="cmu-sign-in-page cmu-sign-in-page--dev cmu-sign-in-page--photo"
        style="--cmu-sign-in-photo: url(&quot;../images/sign-in-buggy.jpg&quot;)"
      >
        <div class="content">
          <div>
            <h1>Sign In</h1>
            <p>
              to&nbsp;<a href="#">sweepstakes.<wbr />example.cmu.edu</a>
            </p>
          </div>
          <div class="cmu-sign-in-card">
            <p class="cmu-label">Development Mode</p>
            <h2>Pick a Test Account</h2>
            <ul class="cmu-dev-people">
              <li aria-current="true">
                <div class="cmu-dev-card">
                  <i class="cmu-profile-picture cmu-profile-initials" aria-hidden="true">AC</i>
                  <strong>Andrew Carnegie</strong>
                  <span>Sweepstakes Chair</span>
                  <small>Everything, including settings and acting as someone else.</small>
                  <span class="cmu-dev-you">You</span>
                </div>
              </li>
              <li>
                <form method="post" action="#">
                  <input type="hidden" name="return_to" value="/teams" />
                  <button type="submit" class="cmu-dev-card btn ghost">
                    <i class="cmu-profile-picture cmu-profile-initials" aria-hidden="true">MM</i>
                    <strong><span class="sr-only">Sign in as </span>Margaret Morrison</strong>
                    <span>Team Captain</span>
                    <small>Their team's roster, buggies and roll times.</small>
                  </button>
                </form>
              </li>
              <li>
                <form method="post" action="#">
                  <input type="hidden" name="return_to" value="/teams" />
                  <button type="submit" class="cmu-dev-card btn ghost">
                    <i class="cmu-profile-picture cmu-profile-initials" aria-hidden="true">AM</i>
                    <strong><span class="sr-only">Sign in as </span>Andrew Mellon</strong>
                    <span>Driver</span>
                    <small>Their own heats and roll times.</small>
                  </button>
                </form>
              </li>
              <li>
                <form method="post" action="#">
                  <input type="hidden" name="return_to" value="/teams" />
                  <button type="submit" class="cmu-dev-card btn ghost">
                    <i class="cmu-profile-picture cmu-profile-initials" aria-hidden="true">TM</i>
                    <strong><span class="sr-only">Sign in as </span>Test Mechanic</strong>
                    <span>Mechanic</span>
                    <small>Safety inspections for every team's buggy.</small>
                  </button>
                </form>
              </li>
              <li>
                <form method="post" action="#">
                  <input type="hidden" name="return_to" value="/teams" />
                  <button type="submit" class="cmu-dev-card btn ghost">
                    <i class="cmu-profile-picture cmu-profile-initials" aria-hidden="true">TS</i>
                    <strong><span class="sr-only">Sign in as </span>Test Spectator</strong>
                    <span>Spectator</span>
                    <small>Signed in, with no team yet.</small>
                  </button>
                </form>
              </li>
              <li>
                <form method="post" action="#">
                  <input type="hidden" name="return_to" value="/teams" />
                  <button type="submit" class="cmu-dev-card cmu-dev-card--out btn ghost">
                    <i class="cmu-profile-picture cmu-profile-initials" aria-hidden="true"></i>
                    <strong>Signed Out</strong>
                    <span>Visitor</span>
                    <small>See what a visitor sees.</small>
                  </button>
                </form>
              </li>
            </ul>
          </div>
        </div>
      </main>
      <div class="cmu-sign-in-footer" role="contentinfo">
        <ul>
          <li>Need help? Email <a href="mailto:example@cmu.edu">example@cmu.edu</a></li>
          <li><a href="https://www.cmu.edu/legal/">Legal Info</a></li>
        </ul>
      </div>
      <nav id="nav" hidden><ul></ul></nav>
    </div>
    <script src="https://www.cmu.edu/common/standard-v6/js/list.min.js"></script>
    <script src="https://www.cmu.edu/common/standard-v6/js/jquery-1.10.1.min.js"></script>
    <script src="https://www.cmu.edu/common/standard-v6/js/main.6.7.min.js"></script>
    <script src="../js/cmu-app.js"></script>
    <script>
      // This example only: there's no app behind it, so picking someone
      // moves "You" to them instead of signing in
      document.querySelector("main").addEventListener("submit", function (e) {
        e.preventDefault();
        var was = document.querySelector(".cmu-dev-people > li[aria-current]"),
          now = e.target.closest("li");
        // The old current person becomes a button again
        var card = was.querySelector(".cmu-dev-card");
        card.querySelector(".cmu-dev-you").remove();
        var form = e.target.cloneNode(false),
          button = document.createElement("button");
        form.innerHTML = e.target.querySelector("input").outerHTML;
        button.type = "submit";
        button.className = card.className + " btn ghost";
        button.innerHTML = card.innerHTML;
        if (!button.classList.contains("cmu-dev-card--out"))
          button
            .querySelector("strong")
            .insertAdjacentHTML("afterbegin", '<span class="sr-only">Sign in as </span>');
        form.append(button);
        was.replaceChildren(form);
        was.removeAttribute("aria-current");
        // The picked person becomes the current one
        var picked = e.target.querySelector("button"),
          div = document.createElement("div");
        div.className = picked.className.replace(/ btn ghost$/, "");
        div.innerHTML = picked.innerHTML;
        var hidden = div.querySelector(".sr-only");
        if (hidden) hidden.remove();
        div.insertAdjacentHTML("beforeend", '<span class="cmu-dev-you">You</span>');
        now.replaceChildren(div);
        now.setAttribute("aria-current", "true");
      });
    </script>
  </body>
</html>
