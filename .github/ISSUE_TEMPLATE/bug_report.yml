name: Bug Report
description: Something looks wrong or doesn't work.
labels: [bug]
body:
  - type: dropdown
    id: version
    attributes:
      label: Which Version?
      description: The number in the version you load, such as 0.8.2, or in the docs' address (/0/ or /1/).
      options:
        - 0.x (the current template)
        - 1.x (the Drupal template)
        - Both
        - Not Sure
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The page or component, with a link if there is one.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What You Expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and Width
      description: For example, "Firefox, phone width" or "Chrome, 1300px".
  - type: textarea
    id: extra
    attributes:
      label: Anything Else
      description: Screenshots help, especially at desktop and phone widths.
