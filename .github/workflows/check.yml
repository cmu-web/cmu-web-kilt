name: Check

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
  # Weekly, so a change to CMU's live template that collides with one of the
  # kit's class names shows up even when nothing here changes
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  rails-gem:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Ruby the gem supports and a current one
        ruby: ["3.2", "3.4"]
        rails: ["~> 7.2.0", "~> 8.0.0", "~> 8.1.0"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/rails
      - run: bundle exec rake test build
        working-directory: packages/rails
