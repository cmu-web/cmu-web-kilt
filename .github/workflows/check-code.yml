# Lints and tests the kit (npm run check), runs its browser tests (npm run
# test:browser) and tests the Rails gem on each supported Ruby and Rails, on
# every push, pull request and version tag, and weekly.
name: Check Code

on:
  push:
    branches: [0.x]
    tags: ["[0-9]*"]
  pull_request:
  workflow_dispatch:
  # Weekly, so a change to CMU's live template that collides with one of the
  # kit's class names shows up even when nothing here changes
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  # In a browser, with the template's live scripts: Escape and the menu under
  # Turbo
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  rails-gem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # The oldest Ruby the gem supports and a current one
        ruby: ["3.2", "3.4"]
        rails: ["~> 7.2.0", "~> 8.0.0", "~> 8.1.0"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/rails
      - run: bundle exec rake test build
        working-directory: packages/rails

  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The oldest Python the package supports and a current one
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m unittest discover packages/python/tests
