name: Pages

# Publishes the docs under /0/ (template line 0), with the kit's own files
# beside the docs' in css/ and js/, and a root page that sends visitors to
# /0/, as webkilt.andrew.cmu.edu serves them. Locally, npm run docs serves
# one line's docs at the root.

on:
  push:
    branches: [0.x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Put the docs under /0/, with the kit's files beside them
        run: |
          mkdir -p _site/0
          cp -r docs/. _site/0/
          cp css/*.css _site/0/css/
          cp js/*.js _site/0/js/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Carnegie Mellon Web Kilt</title><meta http-equiv="refresh" content="0; url=0/"><link rel="canonical" href="https://webkilt.andrew.cmu.edu/0/"><a href="0/">Carnegie Mellon Web Kilt</a>' > _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
