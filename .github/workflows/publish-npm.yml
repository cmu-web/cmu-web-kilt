name: Publish npm

# Publishes the kit's browser files to npm as @cmu-web/kilt from each release
# tag, at the tag's version, so apps can depend on it and Dependabot proposes
# each release. npmjs.com trusts this workflow (trusted publishing), so
# there's no token to store, and each version carries provenance: a signed
# record of the commit and workflow that built it.
on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@12.2.1
      - name: Check the tag matches package.json
        run: test "$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check:versions
      - run: npm publish
